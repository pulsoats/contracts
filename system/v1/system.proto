syntax = "proto3";

package pulsoats.system.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/pulsoats/contracts/gen/go/system/v1;systempb";

enum ServiceKind {
  SERVICE_KIND_ANALYSIS = 0;
  SERVICE_KIND_LIVE = 1;
}
enum ServiceStatus {
  SERVICE_STATUS_HEALTHY = 0;
  SERVICE_STATUS_DEGRADED = 1;
}

message ServiceInfo {
  string id = 1;
  ServiceKind kind = 2;
  string name = 3;
  string exchange = 4;
  string account = 5;
  string version = 6;
}

message ServiceMetrics {
  string service_id = 1;
  ServiceStatus status = 2;
  double cpu_percent = 3;
  double memory_percent = 4;
  int64 uptime_seconds = 5;
  google.protobuf.Timestamp reported_at = 6;
}

service ServiceMonitor {
  rpc Info(google.protobuf.Empty) returns (ServiceInfo);
  rpc Metrics(google.protobuf.Empty) returns (ServiceMetrics);
}
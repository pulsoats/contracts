syntax = "proto3";

package tradebot.analysis.v1;

import "common/v1/detectorcfg.proto";
import "common/v1/fees.proto";
import "common/v1/market_spec.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/pulsoats/contracts/gen/go/analysis/v1;analysispb";

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PENDING = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_DONE = 3;
  RUN_STATUS_FAILED = 4;
}

service AnalysisService {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRunStatus(GetRunRequest) returns (GetRunStatusResponse);
  rpc GetRunMeta(GetRunRequest) returns (RunMeta);
  rpc GetRunResult(GetRunRequest) returns (stream RunResultChunk);
}

message StartRunRequest {
  string user_id = 1;
  tradebot.common.v1.MarketSpec market = 2;
  string interval = 3;
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
  string price_type = 6;
  tradebot.common.v1.DetectorConfig detector = 7;
  tradebot.common.v1.Fees fees = 8;
}

message StartRunResponse {
  string run_id = 1;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunStatusResponse {
  RunStatus status = 1;
  string message = 2;
}

message RunMeta {
  string run_id = 1;
  RunStatus status = 2;
  string user_id = 3;
  tradebot.common.v1.MarketSpec market = 4;
  string interval = 5;
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp to = 7;
  int64 signals_count = 8;
  int64 avg_profit_ppm = 9;
  tradebot.common.v1.DetectorConfig detector = 10;
  string price_type = 11;
  google.protobuf.Timestamp created_at = 12;
}

message RunResultChunk {
  bytes data = 1;
}

syntax = "proto3";

package pulsoats.analysis.v1;

import "common/v1/detect.proto";
import "common/v1/market.proto";
import "common/v1/run.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/pulsoats/contracts/gen/go/analysis/v1;analysispb";

enum RunFilter {
  RUN_FILTER_UNSPECIFIED = 0;
  RUN_FILTER_MINE = 1;
  RUN_FILTER_SHARED = 2;
  RUN_FILTER_ALL = 3;
}

// X-Service-Token METADATA IS REQUIRED
service Analysis {
  rpc NewRun(NewRunRequest) returns (Run); // X-User-Id METADATA IS REQUIRED
  rpc GetRun(common.v1.RunID) returns (Run);
  rpc GetRunArchive(common.v1.RunID) returns (stream RunArchiveChunk);
  rpc ShareRun(common.v1.RunID) returns (google.protobuf.Empty); // X-User-Id METADATA IS REQUIRED
  rpc DeleteRun(common.v1.RunID) returns (google.protobuf.Empty); // X-User-Id METADATA IS REQUIRED
  rpc ListRunsPaged(ListRunsRequest) returns (ListRunsResponse); // X-User-Id METADATA IS REQUIRED

  rpc ListAvailableDetectors(google.protobuf.Empty) returns (common.v1.ListAvailableDetectors);
}

message NewRunRequest {
  pulsoats.common.v1.MarketSpec market = 1;
  string interval = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  pulsoats.common.v1.DetectorConfig detector = 5;
  optional pulsoats.common.v1.Fees fees = 6;
}

message Run {
  string id = 1;
  pulsoats.common.v1.Status status = 2;
  pulsoats.common.v1.MarketSpec market = 3;
  string interval = 4;
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  pulsoats.common.v1.DetectorConfig detector = 7;
  int64 signals_count = 8;
  int64 avg_profit_ppm = 9;
  google.protobuf.Timestamp created_at = 10;
  string created_by = 11;
  bool is_shared = 12;
  google.protobuf.Timestamp shared_at = 13;
}

message RunArchiveChunk {
  bytes data = 1;
}

message ListRunsRequest {
  int32 limit = 1;
  int64 before_id = 2;
  RunFilter filter = 3;
}

message ListRunsResponse {
  repeated Run runs = 1;
  int64 next_before_id = 2;
  bool has_more = 3;
}
syntax = "proto3";

package pulsoats.analysis.v1;

import "common/v1/detectorcfg.proto";
import "common/v1/fees.proto";
import "common/v1/market_spec.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/pulsoats/contracts/gen/go/analysis/v1;analysispb";

enum RunStatusCode {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PENDING = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_DONE = 3;
  RUN_STATUS_FAILED = 4;
}

enum RunFilter {
  RUN_FILTER_UNSPECIFIED = 0;
  RUN_FILTER_MINE = 1;
  RUN_FILTER_SHARED = 2;
  RUN_FILTER_ALL = 3;
}

service Analysis {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRunMeta(GetRunRequest) returns (RunMeta);
  rpc GetRunResult(GetRunRequest) returns (stream RunResultChunk);
  rpc ListRunsPaged(ListRunsRequest) returns (ListRunsResponse);
  rpc ShareRun(ShareRunRequest) returns (ShareRunResponse);
  rpc DeleteRun(DeleteRunRequest) returns (google.protobuf.Empty);
}

message StartRunRequest {
  string user_id = 1;
  pulsoats.common.v1.MarketSpec market = 2;
  string interval = 3;
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
  string price_type = 6;
  pulsoats.common.v1.DetectorConfig detector = 7;
  pulsoats.common.v1.Fees fees = 8;
}

message StartRunResponse {
  string run_id = 1;
}

message GetRunRequest {
  string run_id = 1;
}

message Status {
  RunStatusCode code = 1;
  string message = 2;
}

message RunMeta {
  string id = 1;
  Status status = 2;
  pulsoats.common.v1.MarketSpec market = 3;
  string price_type = 4;
  string interval = 5;
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp to = 7;
  pulsoats.common.v1.DetectorConfig detector = 8;
  int64 signals_count = 9;
  int64 avg_profit_ppm = 10;
  string created_by = 11;
  google.protobuf.Timestamp created_at = 12;
  bool is_shared = 13;
  google.protobuf.Timestamp shared_at = 14;
}

message RunResultChunk {
  bytes data = 1;
}

message ListRunsRequest {
  int32 limit = 1;
  int64 before_id = 2;
  RunFilter filter = 3;
}

message ListRunsResponse {
  repeated RunMeta items = 1;
  int64 next_before_id = 2;
  bool has_more = 3;
}

message ShareRunRequest {
  string run_id = 1;
}

message ShareRunResponse {
  bool success = 1;
}

message DeleteRunRequest {
  string run_id = 1;
  string user_id = 2;
}
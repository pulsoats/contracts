syntax = "proto3";

package pulsoats.common.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/pulsoats/contracts/gen/go/common/v1;commonpb";

message DetectorConfig {
  string code = 1;
  string label = 2;
  bytes opts = 4;
}

message DetectorMeta {
  string code = 1;
  string description = 2;
  string kind = 3;
  bytes opts_schema = 4;
  string version = 5;
}

service Catalog {
    rpc ListAvailableDetectors(google.protobuf.Empty) returns (ListAvailableDetectorsResponse);
}

message ListAvailableDetectorsResponse {
  repeated DetectorMeta detectors = 1;
}

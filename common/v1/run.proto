syntax = "proto3";

package pulsoats.common.v1;

option go_package = "github.com/pulsoats/contracts/gen/go/common/v1;commonpb";

enum RunStatusCode {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PENDING = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_DONE = 3;
  RUN_STATUS_FAILED = 4;
}

message RunID {
  string run_id = 1;
}

message Status {
  RunStatusCode code = 1;
  string message = 2;
}


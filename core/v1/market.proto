syntax = "proto3";

package pulsoats.core.v1;

option go_package = "github.com/pulsoats/contracts/gen/go/core/v1;corepb";

message MarketSpec {
  string exchange = 1;
  string category = 2;
  string symbol = 3;
}

message Fees {
  int64 taker_fee_ppm = 1;
  int64 maker_fee_ppm = 2;
}

message ExchangeMeta {
  string code = 1;
  repeated string categories = 2;
  repeated string intervals = 3;
}